<div data-role="header" class="ui-corner-top">
  <h1>Config</h1>
</div>
<div data-role="content" class="ui-corner-bottom ui-content">
  <form>
    <fieldset data-role="controlgroup" data-type="horizontal">
      <legend>View mode</legend>
      <input name="view-mode-radio-choice"
             id="view-mode-radio-choice-one"
             value="OnePage"
             {{#if OnePage}}checked="checked"{{/if}}
             type="radio">
      <label id="view-mode-radio-choice-one-label"
             for="view-mode-radio-choice-one">one page</label>
      <input name="view-mode-radio-choice"
             id="view-mode-radio-choice-two"
             value="TwoPage"
             {{#if TwoPage}}checked="checked"{{/if}}
             type="radio">
      <label id="view-mode-radio-choice-two-label"
             for="view-mode-radio-choice-two">two pages</label>
    </fieldset>
    <fieldset data-role="controlgroup" data-type="horizontal">
      <legend>Page direction</legend>
      <input name="page-direction-radio-choice"
             id="page-direction-radio-choice-L2R"
             value="L2R"
             {{#if L2R}}checked="checked"{{/if}}
             type="radio">
      <label id="page-direction-radio-choice-L2R-label"
             for="page-direction-radio-choice-L2R">left to right</label>
      <input name="page-direction-radio-choice"
             id="page-direction-radio-choice-R2L"
             value="R2L"
             {{#if R2L}}checked="checked"{{/if}}
             type="radio">
      <label id="page-direction-radio-choice-R2L-label"
             for="page-direction-radio-choice-R2L">right to left</label>
    </fieldset>
    <input name="range-request-choice"
           id="range-request-checkbox"
           {{#if enablesRangeRequestInPdf}}checked="checked"{{/if}}
           type="checkbox">
    <label id="range-request-checkbox-label"
           for="range-request-checkbox">Range-Request when reading PDF files</label>
    {{#if fullscreenIsSupported}}
    <input name="fullscreen-choice"
           id="fullscreen-checkbox"
           {{#if fullscreenIsActive}}checked="checked"{{/if}}
           type="checkbox">
    <label id="fullscreen-checkbox-label"
           for="fullscreen-checkbox">Fullscreen</label>
    {{/if}}

    <fieldset data-role="controlgroup">
      <legend>Menu buttons</legend>
      <input type="checkbox" class="menu-visibility" name="showFile" id="menu-file"
             {{#if showFile}}checked="checked"{{/if}}>
      <label for="menu-file">File</label>
      <input type="checkbox" class="menu-visibility" name="showDropbox" id="menu-dropbox"
             {{#if showDropbox}}checked="checked"{{/if}}>
      <label for="menu-dropbox">Dropbox</label>
      <input type="checkbox" class="menu-visibility" name="showGoogleDrive" id="menu-google-drive"
             {{#if showGoogleDrive}}checked="checked"{{/if}}>
      <label for="menu-google-drive">Google Drive</label>
    </fieldset>
  </form>
</div>
<div data-role="footer" class="ui-bar">
  <div align="right">
    <a href="#"
       data-role="button"
       data-icon="delete"
       data-inline="true"
       data-rel="back"
       style="font-size:16px;">
      Close
    </a>
  </div>
</div>
